<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Launcher風 UI 完全版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="launcher">

    <!-- 左サイドバー -->
    <aside class="sidebar">
        <h2>ゲーム</h2>
        <ul>
            <li class="active">Minecraft: Java Edition</li>
            <li>Minecraft for Windows</li>
            <li>Snapshot</li>
            <li>最新リリース</li>
        </ul>
    </aside>

    <!-- メインコンテンツ -->
    <main class="main">
        <div class="hero">
            <h1>Minecraft</h1>
            <p>ようこそ、冒険の世界へ！</p>
        </div>

        <!-- 下部プレイバー -->
        <div class="playbar">
            <select>
                <option>最新の-release（1.20.1）</option>
                <option>Snapshot</option>
                <option>Forge プロファイル</option>
            </select>

            <button class="play">▶ プレイ</button>
        </div>
    </main>

</div>

</body>
</html>
