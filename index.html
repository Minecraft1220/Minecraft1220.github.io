<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Creation Client Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="launcher">

    <!-- 左サイドバー -->
    <aside class="sidebar">
        <h2>ゲーム</h2>
        <ul>
            <li class="active">Minecraft: Java Edition</li>
            <li>Minecraft for Windows</li>
            <li>Snapshot</li>
            <li>最新リリース</li>
        </ul>
    </aside>

    <!-- メインコンテンツ -->
    <main class="main">
        <div class="hero">
            <h1>Minecraft</h1>
            <p>ようこそ、冒険の世界へ！</p>
        </div>

        <!-- 下部プレイバー -->
        <div class="playbar">
            <select>
                <option>使用可能なリリース(1.8.8)</option>
                <option>Snapshot</option>
                <option>Forge 1.8.8</option>
            </select>

            <button class="play" onclick="location.href='main.html'">▶ プレイ</button>
        </div>
    </main>

</div>

</body>
</html>
